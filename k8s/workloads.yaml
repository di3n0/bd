apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackduck-detect
  labels: &detectLabels
    app.kubernetes.io/name: blackduck-detect
    app.kubernetes.io/part-of: black-duck-sca
spec:
  replicas: 1
  selector:
    matchLabels: *detectLabels
  template:
    metadata:
      labels: *detectLabels
    spec:
      serviceAccountName: blackduck-wrapper
      containers:
        - name: wrapper
          image: your-registry/blackduck-detect-wrapper:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SCAN_OPERATION
              value: detector
          envFrom:
            - configMapRef:
                name: blackduck-wrapper-config
            - secretRef:
                name: blackduck-credentials
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---

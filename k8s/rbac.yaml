apiVersion: v1
kind: ServiceAccount
metadata:
  name: blackduck-wrapper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blackduck-wrapper-job-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blackduck-wrapper-job-manager
subjects:
  - kind: ServiceAccount
    name: blackduck-wrapper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blackduck-wrapper-job-manager
